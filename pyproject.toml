[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-simulator"
version = "1.1.0"
description = "技术岗位 AI 模拟面试程序"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.9",
  "textual>=1.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[project.scripts]
interview-simulator = "interview_simulator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["interview_simulator*"]

[tool.setuptools.package-data]
interview_simulator = ["static/*.html", "static/*.css", "static/*.js"]
